[global]
  server role = standalone server
  server min protocol = SMB2_10
  server signing = mandatory
  map to guest = never
  load printers = no
  disable spoolss = yes
  log level = 1
[signed]
  path = /shares/signed
  read only = no
  valid users = testuser
[encrypted]
  path = /shares/encrypted
  read only = no
  valid users = testuser
  server smb encrypt = required
