name: ShareLink
options:
  bundleIdPrefix: com.ajthom90
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  ShareLinkKit:
    path: Packages/ShareLinkKit
targets:
  ShareLink:
    type: application
    platform: iOS
    sources:
      - App/ShareLink
    info:
      path: App/ShareLink/Info.plist
      properties:
        CFBundleDisplayName: ShareLink
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundlePackageType: APPL
        CFBundleName: "$(PRODUCT_NAME)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: ShareLink connects to file servers on your local network.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - sharelink
    entitlements:
      path: App/ShareLink/ShareLink.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ajthom90.sharelink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ajthom90.sharelink
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: ShareLinkKit
      - target: ShareLinkFileProvider
  ShareLinkFileProvider:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/FileProvider
    info:
      path: Extensions/FileProvider/Info.plist
      properties:
        CFBundleDisplayName: ShareLink
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundlePackageType: "XPC!"
        CFBundleName: "$(PRODUCT_NAME)"
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: ShareLink connects to file servers on your local network.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FileProviderExtension"
          NSExtensionFileProviderDocumentGroup: group.com.ajthom90.sharelink
          NSExtensionFileProviderSupportsEnumeration: true
    entitlements:
      path: Extensions/FileProvider/FileProvider.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ajthom90.sharelink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ajthom90.sharelink.FileProvider
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: ShareLinkKit
    postBuildScripts:
      - name: Strip nested frameworks (AMSMB2 is embedded in the app)
        script: |
          rm -rf "${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
        basedOnDependencyAnalysis: false
schemes:
  ShareLink:
    build:
      targets:
        ShareLink: all
        ShareLinkFileProvider: all
    archive:
      config: Release
